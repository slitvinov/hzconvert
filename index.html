function layer(l,x,act){
  const y=new Float64Array(l.w.length);
  for(let i=0;i<l.w.length;i++){
    let s=l.b[i]; const r=l.w[i];
    for(let j=0;j<r.length;j++) s+=r[j]*x[j];
    y[i]=act ? s/(1+Math.exp(-s)) : s;
  }
  return y;
}
function decodeLat(lat){
  const out=MODEL.labels.map(()=>new Array(T));
  for(let t=0;t<T;t++){
    let y=lat.slice(t*K,(t+1)*K);
    for(let l=0;l<MODEL.dec.length;l++)
      y=layer(MODEL.dec[l], y, l<MODEL.dec.length-1);
    for(let c=0;c<y.length;c++)
      out[c][t]=y[c]*MODEL.ys[c]+MODEL.ym[c];
  }
  return out;
}
function scenario(){
  const key=cur+':'+dout;
  if(key in SCEN) return SCEN[key];
  const sd=SD[cur+'_'+dout], lat=new Array(T*K);
  for(let t=0;t<T;t++){
    const pos=(t+1)/6-1, lo=Math.floor(pos), fr=pos-lo;
    for(let i=0;i<K;i++){
      const a=lo<0?0:sd[lo*K+i];
      const b=sd[Math.min(lo+1,sd.length/K-1)*K+i];
      lat[t*K+i]=FC[cur][t*K+i]+a+(b-a)*fr;
    }
  }
  return SCEN[key]=decodeLat(lat);
}

const TYP={};
function typicalDay(c){
  if(c in TYP) return TYP[c];
  const s=new Array(24).fill(0), n=new Array(24).fill(0);
  const m=MEASCH[c];
  for(let i=0;i<V0;i++){
    if(m[i]==null) continue;
    const h=Math.floor((i%1440)/60);
    s[h]+=m[i]; n[h]++;
  }
  const prof=s.map((v,h)=>n[h]?v/n[h]:null);
  const nh=Math.ceil(m.length/60);
  return TYP[c]=Array.from({length:nh},(_,i)=>prof[i%24]);
}

function load(src,cb){
  const s=document.createElement('script');
  s.src=src; s.onload=cb; document.head.appendChild(s);
}
function withScenario(cb){
  if(dout<0){ cb(); return; }
  const f=cur+'_'+dout;
  if(f in SD){ cb(); return; }
  load('data/sd'+f+'.js',cb);
}
function withMeasured(cb){
  const need=[chan, chan2].filter(c=>c>=0 && !(c in MEASCH));
  if(!need.length){ cb(); return; }
  let left=need.length;
  need.forEach(c=>load('data/meas'+c+'.js',()=>{ if(--left===0) cb(); }));
}

function bandAt(i){
  const tl=loc(X0+i*DX);
  const m=Math.floor(tl/60000)%1440;
  const w=new Date(tl).getUTCDay();
  const work=(w>=1&&w<=5);
  return (work && m>=PLAN.wstart && m<PLAN.wend) ? PLAN.hi : PLAN.lo;
}
const PLANC={};
function activeForecast(){
  return dout<0 ? DECODED[cur] : scenario();
}
function planHeating(){
  const key=cur+':'+dout;
  if(key in PLANC) return PLANC[key];
  const B=activeForecast()[PLAN.chan], s=STARTS[cur], dt=STRIDE;
  const gain=1/PLAN.UA;
  const band=new Array(T), deficit=new Array(T);
  for(let i=0;i<T;i++){
    band[i]=bandAt(s+(i+1)*dt);
    deficit[i]=Math.max(0, band[i]-B[i]);
  }
  const sh=Math.round(PLAN.TAUS/dt);
  const req=new Array(T);
  for(let i=0;i<T;i++)
    req[i]=Math.max(deficit[i], deficit[Math.min(i+sh,T-1)]);
  for(let i=T-1;i>0;i--){
    const slope=dt*(PLAN.CAP*gain-req[i])/(PLAN.TAU+PLAN.TAUS);
    req[i-1]=Math.max(req[i-1], req[i]-slope);
  }
  const q=new Array(T).fill(0), Tp=new Array(T);
  let d1=0, d2=0;
  for(let i=0;i<T;i++){
    const d1t=req[i]+(req[i]-d2)*PLAN.TAU/dt;
    const want=PLAN.UA*((d1t-d1)*PLAN.TAUS/dt + d1);
    const qi=Math.min(PLAN.CAP, Math.max(0, want));
    d1+=dt*(qi*gain-d1)/PLAN.TAUS;
    d2+=dt*(d1-d2)/PLAN.TAU;
    q[i]=qi; Tp[i]=B[i]+d2;
  }
  let energy=0, pre=-1;
  for(let i=0;i<T;i++){
    energy+=q[i]*dt/60;
    if(pre<0 && q[i]>0) pre=s+(i+1)*dt;
  }
  return PLANC[key]={q, Tp, band, energy, pre};
}
function hhmm(i){
  const m=Math.floor(loc(X0+i*DX)/60000)%1440;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+
         String(m%60).padStart(2,'0');
}

const CUTS=[1717214400000, 1730613600000, 1741503600000];
const OFFS=[-14400000, -18000000, -14400000];
function off(t){
  let k=0;
  while(k+1<CUTS.length && t>=CUTS[k+1]) k++;
  return OFFS[k];
}
function loc(t){ return t+off(t); }
function unloc(v){
  for(let k=0;k<CUTS.length;k++){
    const t=v-OFFS[k];
    if(t>=CUTS[k] && (k===CUTS.length-1 || t<CUTS[k+1])) return t;
  }
  return v-OFFS[0];
}
function segs(x0,dx,y,tmpl){
  const cuts=CUTS.slice(1).filter(b=>b>x0 && b<x0+dx*y.length)
                .map(b=>Math.ceil((b-x0)/dx));
  cuts.push(y.length);
  const out=[]; let s=0;
  for(const e of cuts){
    if(e>s){
      const t=Object.assign({},tmpl,
        {x0:loc(x0+s*dx), dx:dx, y:y.slice(s,e),
         legendgroup:tmpl.name||'g'});
      if(s>0) t.showlegend=false;
      out.push(t);
    }
    s=e;
  }
  return out;
}

function disp(c){
  if(c in DISP) return DISP[c];
  const m=MEASCH[c], out=new Array(Math.ceil(m.length/DS));
  for(let i=0,k=0;i<m.length;i+=DS,k++) out[k]=m[i];
  return DISP[c]=out;
}

  return segs(X0,DS*DX,disp(c),

      for(let k=0;k<bandS.length;k++){
        traces.push(bandS[k]);
        traces.push(ceilS[k]);
      }
      traces.push(...segs(t0+STRIDE*DX,STRIDE*DX,pl.Tp,

      let on=-1;
      for(let i=0;i<=pl.q.length;i++){
        const run=i<pl.q.length && pl.q[i]>0;
        if(run && on<0) on=i;

    lineIdx=shapes.length;

    hovermode:'x unified', height:600,
    dragmode:'pan', uirevision:'keep',
    margin:{t:20,r:60,b:70}, shapes,
    legend:{orientation:'h',y:-0.28}};
  if(chan2>=0)
    layout.yaxis2={title:{text:LBL[chan2]}, overlaying:'y',
                   side:'right', showgrid:false};
  Plotly.react(ui.plot,traces,layout,{scrollZoom:true});
}

let lineIdx=-1;
function show(k){
  if(k<0||k>=STARTS.length||k===cur) return;
  const go=()=>{ if(!(k in DECODED)) DECODED[k]=decodeLat(FC[k]);
                 cur=k; ui.fc.checked=true; draw(); };
  if(k in FC) withMeasured(go);
  else load('data/fc'+k+'.js',()=>withMeasured(go));
}
function place(idx){
  let best=0,bd=Infinity;
  STARTS.forEach((s,k)=>{const d=Math.abs(s-idx); if(d<bd){bd=d;best=k;}});
  show(best);
}
function parseAxisDate(v){
  return typeof v==='number' ? v
       : Date.parse(v.split('.')[0].replace(' ','T')+'Z');
}
ui.fc.onchange=()=>{
  if(!ui.fc.checked){
    cur=-1; ui.when.textContent='no forecast placed'; draw(); return;
  }
  const r0=unloc(parseAxisDate(ui.plot._fullLayout.xaxis.range[0]));
  place(Math.round((r0-X0)/DX));
};

ui.chan.onchange=()=>{ chan=+ui.chan.value; withMeasured(draw); };
ui.chan2.onchange=()=>{ chan2=+ui.chan2.value; withMeasured(draw); };
ui.typ.onchange=draw;
ui.plan.onchange=draw;
ui.dout.onchange=()=>{ dout=+ui.dout.value; withScenario(draw); };
ui.prev.onclick=()=>show(cur-1);
ui.next.onclick=()=>show(cur+1);
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') show(cur-1);
  if(e.key==='ArrowRight') show(cur+1);
});
withMeasured(()=>{
  draw();
  ui.plot.on('plotly_relayout',ev=>{
    for(const k in ev){
      const m=k.match(/^shapes\[(\d+)\]\.x0$/);
      if(m && +m[1]===lineIdx)
        place(Math.round((unloc(parseAxisDate(ev[k]))-X0)/DX));
    }
  });
});
</script></body></html>
