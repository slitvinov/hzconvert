  ui.chan.appendChild(new Option(l,i));
  ui.chan2.appendChild(new Option(l,i));
});
ui.chan.value=chan; ui.chan2.value=-1;

// ---- decoder: latent (8) -> all 37 channels ------------------------------
function layer(l,x,act){
  const y=new Float64Array(l.w.length);
  for(let i=0;i<l.w.length;i++){
    let s=l.b[i]; const r=l.w[i];
    for(let j=0;j<r.length;j++) s+=r[j]*x[j];
    y[i]=act ? s/(1+Math.exp(-s)) : s;   // SiLU on hidden layers
  }
  return y;
}
function decodeAll(k){
  const out=MODEL.labels.map(()=>new Array(T));
  for(let t=0;t<T;t++){
    const z=FC[k].slice(t*K,(t+1)*K);
    const y=layer(MODEL.dec[2], layer(MODEL.dec[1],
             layer(MODEL.dec[0], z, true), true), false);
    for(let c=0;c<y.length;c++)
      out[c][t]=y[c]*MODEL.ys[c]+MODEL.ym[c];
  }
  return out;
}

// ---- typical-day baseline: hour-of-day mean over the training period -----
const TYP={};
function typicalDay(c){
  if(c in TYP) return TYP[c];
  const s=new Array(24).fill(0), n=new Array(24).fill(0);
  const m=MEASCH[c];
  for(let i=0;i<V0;i++){
    if(m[i]==null) continue;
    const h=Math.floor((i%1440)/60);
    s[h]+=m[i]; n[h]++;
  }
  const prof=s.map((v,h)=>n[h]?v/n[h]:null);
  const nh=Math.ceil(m.length/60);
  return TYP[c]=Array.from({length:nh},(_,i)=>prof[i%24]);
}

// ---- lazy loading of data files ------------------------------------------
function load(src,cb){
  const s=document.createElement('script');
  s.src=src; s.onload=cb; document.head.appendChild(s);
}
function withMeasured(cb){
  const need=[chan, chan2].filter(c=>c>=0 && !(c in MEASCH));
  if(!need.length){ cb(); return; }
  let left=need.length;
  need.forEach(c=>load('data/meas'+c+'.js',()=>{ if(--left===0) cb(); }));
}

// ---- drawing --------------------------------------------------------------
function rmse(fy,minutes){
  const s=STARTS[cur]; let e=0,n=0;
  const lim=Math.min(minutes/STRIDE, T);
  for(let i=0;i<lim;i++){
    const y=MEASCH[chan][s+(i+1)*STRIDE];
    if(y==null) continue;
    const d=fy[i]-y; e+=d*d; n++;
  }
  return n? Math.sqrt(e/n).toFixed(2) : '--';
}
function meas(c,color){
  return {x0:X0, dx:DX, y:MEASCH[c], name:MODEL.labels[c]+' measured',
          type:'scattergl', mode:'lines',
          line:{width:1,color:color}, connectgaps:false};
}
function fcast(c,color){
  const t0=X0+STARTS[cur]*DX;
  return {x0:t0+STRIDE*DX, dx:STRIDE*DX, y:DECODED[cur][c],
          name:MODEL.labels[c]+' forecast', type:'scattergl',
          mode:'lines', line:{width:1.8,color:color}};
}
function draw(){
  const traces=[meas(chan,'#1f77b4')];
  if(chan2>=0 && chan2 in MEASCH) traces.push(meas(chan2,'#2ca02c'));
  if(ui.typ.checked && chan in MEASCH)
    traces.push({x0:X0+30*DX, dx:60*DX, y:typicalDay(chan),
      name:'typical day', type:'scattergl', mode:'lines',
      line:{width:1,color:'#7f7f7f',dash:'dot'}});
  const shapes=[];
  if(cur>=0){
    const t0=X0+STARTS[cur]*DX;
    traces.push(fcast(chan,'#ff7f0e'));
    if(chan2>=0) traces.push(fcast(chan2,'#9467bd'));
    traces.push({x:[t0], y:[MEASCH[chan][STARTS[cur]]],
      type:'scatter', mode:'markers',
      marker:{size:9,color:'#d62728'}, showlegend:false});
    shapes.push({type:'line', x0:t0, x1:t0, y0:0, y1:1, yref:'paper',
      line:{color:'#d62728', width:1, dash:'dot'}});
    ui.when.textContent='forecast from '+
      new Date(t0).toISOString().slice(0,16).replace('T',' ')+' UTC';
    const fy=DECODED[cur][chan];
    ui.rmse.textContent='RMSE  1h: '+rmse(fy,60)+'  1d: '+rmse(fy,1440)+
      '  7d: '+rmse(fy,10080)+'  F';
  }
  Plotly.react(ui.plot,traces,{
    xaxis:{type:'date', range:[X0, X0+14*1440*DX],
           rangeslider:{visible:true,thickness:0.06}},
    hovermode:'x unified', height:600,
    dragmode:'pan', uirevision:'keep',
    margin:{t:20,r:10,b:70}, shapes,
    legend:{orientation:'h',y:-0.28}}, {scrollZoom:true});
}

// ---- placing the forecast start -------------------------------------------
function show(k){
  if(k<0||k>=STARTS.length) return;
  const go=()=>{ if(!(k in DECODED)) DECODED[k]=decodeAll(k);
                 cur=k; draw(); };
  if(k in FC) withMeasured(go);
  else load('data/fc'+k+'.js',()=>withMeasured(go));
}
function place(idx){
  let best=0,bd=Infinity;
  STARTS.forEach((s,k)=>{const d=Math.abs(s-idx); if(d<bd){bd=d;best=k;}});
  show(best);
}
function parseAxisDate(v){
  return typeof v==='number' ? v
       : Date.parse(v.split('.')[0].replace(' ','T')+'Z');
}
// In place mode a transparent pane covers the chart, so the click never
// touches plotly's event machinery; pixel -> time by proportion over the
// visible axis range.
let overlay=null;
ui.mode.onclick=()=>{
  const place_mode = !overlay;
  ui.mode.textContent = place_mode ?
    'mouse: click to place start' : 'mouse: navigate';
  ui.mode.classList.toggle('place', place_mode);
  if(!place_mode){ overlay.remove(); overlay=null; return; }
  overlay=document.createElement('div');
  overlay.style.cssText=
    'position:absolute;inset:0;z-index:1000;background:rgba(214,39,40,.03)';
  ui.plot.style.position='relative';
  overlay.addEventListener('click',ev=>{
    try{
      const bb=overlay.getBoundingClientRect();
      const xa=ui.plot._fullLayout.xaxis;
      const px=ev.clientX-bb.left-xa._offset;
      if(px<0||px>xa._length) return;
      const r0=parseAxisDate(xa.range[0]), r1=parseAxisDate(xa.range[1]);
      place(Math.round((r0+(px/xa._length)*(r1-r0)-X0)/DX));
    }catch(e){ ui.when.textContent='error: '+e.message; }
  });
  ui.plot.appendChild(overlay);
};

// ---- wiring ----------------------------------------------------------------
ui.chan.onchange=()=>{ chan=+ui.chan.value; withMeasured(draw); };
ui.chan2.onchange=()=>{ chan2=+ui.chan2.value; withMeasured(draw); };
ui.typ.onchange=draw;
ui.prev.onclick=()=>show(cur-1);
ui.next.onclick=()=>show(cur+1);
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') show(cur-1);
  if(e.key==='ArrowRight') show(cur+1);
});
withMeasured(draw);
</script></body></html>
