name: roundtrip
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pandas
      - run: ./bootstrap.sh
      - run: python3 roundtrip.py
