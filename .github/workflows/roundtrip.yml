name: roundtrip
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pandas
      - run: ./run.sh || echo "run.sh exited non-zero"
      - name: head data.csv
        run: head -3 data.csv | cut -c1-300
      - name: upload data.csv
        uses: actions/upload-artifact@v4
        with:
          name: data-csv
          path: data.csv
          retention-days: 1
